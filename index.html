<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c12" />
  <meta name="description" content="Morris Desk — AI可視化辦公室 · real 3D · wired to Grok Bot specialists" />
  <link rel="canonical" href="https://morriscsy.github.io/visual-office/" />

  <title>AI可視化辦公室 v0.2 · Morris Desk · 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" crossorigin src="/visual-office/assets/index-BffgYLHD.js"></script>
  <link rel="stylesheet" crossorigin href="/visual-office/assets/index-oS4BuBHq.css">
</head>
<body>
  <div id="app">
    <canvas id="office-canvas"></canvas>

    <header class="hud-top">
      <div class="brand">
        <span class="brand-mark">▣</span>
        <div>
          <div class="brand-title">AI可視化辦公室 <span class="ver">v0.2</span></div>
          <div class="brand-sub">Morris Desk · 3D · Grok Bot specialists</div>
        </div>
      </div>
      <div class="hud-pills">
        <span id="kill-pill" class="pill kill inactive">KILL · inactive</span>
        <span id="clock-pill" class="pill clock">—</span>
      </div>
    </header>

    <div class="hud-paper" id="paper-bar">
      <span class="paper-label">模擬 / PAPER</span>
      <span class="paper-bal" id="paper-bal">$10,000</span>
      <span class="paper-pnl" id="paper-pnl">0.00%</span>
      <div class="tickers" id="tickers"></div>
    </div>

    <aside class="hud-feed" id="feed-panel">
      <div class="feed-head">
        <span>Announcement feed</span>
        <button type="button" id="feed-toggle" aria-label="Toggle feed">−</button>
      </div>
      <div class="feed-body" id="feed-body"></div>
    </aside>

    <div class="hud-hint">拖曳旋轉 · 滾輪縮放 · 點擊員工開詳情 · 雙指觸控</div>

    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true">
        <button type="button" class="modal-close" id="modal-close" aria-label="Close">×</button>
        <div class="modal-avatar" id="modal-swatch"></div>
        <h2 id="modal-name">—</h2>
        <p class="modal-role" id="modal-role">—</p>
        <p class="modal-zone" id="modal-zone">—</p>
        <div class="modal-status" id="modal-status">idle</div>
        <p class="modal-last" id="modal-last">—</p>
        <p class="modal-at" id="modal-at">—</p>
        <div class="modal-actions">
          <a class="btn primary" id="modal-open" href="#" target="_blank" rel="noopener">Open in Grok Bot</a>
          <button type="button" class="btn" id="modal-copy">Copy agent id</button>
        </div>
        <p class="modal-id mono" id="modal-id">—</p>
      </div>
    </div>
  </div>
</body>
</html>
